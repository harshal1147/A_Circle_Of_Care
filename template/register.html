{% extends 'navbar.html' %}
{% load static %}

{% block content %}
<title>Join US</title>
<style>
    body {
        /* FamilyConnect Theme Background */
        background: linear-gradient(to right, #f3e5f5, #ede7f6);
    }

    .register-container {
        max-width: 500px;
        margin: 60px auto;
        padding: 40px;
        background: #ffffff;
        border-radius: 20px;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        animation: fadeInUp 1s ease-in-out;
    }

    .register-container h2 {
        color: #4a148c;
        /* Dark Purple */
        font-weight: bold;
        text-align: center;
        margin-bottom: 25px;
        font-family: 'Segoe UI', sans-serif;
    }

    .btn-custom {
        background-color: #9575cd;
        /* Primary Theme Color */
        color: white;
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: none;
        font-size: 16px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-custom:hover {
        background-color: #7e57c2;
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(149, 117, 205, 0.4);
        color: white;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-text-link {
        color: #7e57c2;
        text-decoration: none;
        font-weight: 500;
    }

    .form-text-link:hover {
        text-decoration: underline;
        color: #5e35b1;
    }

    @keyframes fadeInUp {
        from {
            transform: translateY(30px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }
</style>

<div class="container">
    <div class="register-container">
        <h2>Join FamilyConnect 💜</h2>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-group">
                <label class="mb-2 text-muted">Username</label>
                {{ u_form.username }}
            </div>

            <div class="form-group">
                <label class="mb-2 text-muted">Email Address</label>
                {{ u_form.email }}
            </div>

            <div class="form-group">
                <label class="mb-2 text-muted">Password</label>
                {{ u_form.password }}
            </div>

            <div class="form-group">
                <label class="mb-2 text-muted">Profile Picture</label>
                {{ p_form.image }}
            </div>

            <button type="submit" class="btn btn-custom mt-3">Create Account</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted">Already a member? <a href="{% url 'login' %}" class="form-text-link">Login here</a>
            </p>
        </div>
    </div>
</div>

{% include 'footer.html' %}
{% endblock %}
