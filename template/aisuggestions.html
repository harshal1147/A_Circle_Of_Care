{% extends 'navbar.html' %}
{% load static%}
{% block content %}

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Suggestions</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(to right, #f3e5f5, #ede7f6);
        color: #3e3e3e;
        overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
        background-color: #9575cd;
    }

    .navbar-brand,
    .nav-link {
        color: #fff !important;
        font-weight: 500;
        transition: color 0.3s ease;
    }

    .nav-link:hover {
        color: #d1c4e9 !important;
    }

    /* Hero */
    .hero {
        text-align: center;
        padding: 80px 20px;
        background: linear-gradient(to bottom right, #d1c4e9, #f3e5f5);
        border-radius: 20px;
        margin: 30px auto;
        max-width: 1200px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        animation: fadeIn 2s ease-in-out;
    }

    .hero h1 {
        font-size: 2.5rem;
        font-weight: bold;
        color: #4a148c;
        animation: slideDown 1.5s ease-out;
    }

    .hero p {
        font-size: 1.1rem;
        margin-top: 15px;
        color: #5e35b1;
        animation: fadeInUp 2s ease-in-out;
    }

    /* Chatbot */
    .chat-container {
        background: #f8f6fb;
        border-radius: 15px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        max-width: 700px;
        margin: 40px auto;
        display: flex;
        flex-direction: column;
        height: 500px;
        overflow: hidden;
        opacity: 0;
        transform: translateY(30px);
    }

    .chat-box {
        flex: 1;
        padding: 20px;
        overflow-y: auto;
    }

    .chat-message {
        margin: 10px 0;
        padding: 12px 18px;
        border-radius: 15px;
        max-width: 75%;
        width: fit-content; 
        animation: fadeIn 0.6s ease-in-out;
    }
    .user-message {
        background: #9575cd;
        color: #fff;
        margin-left: auto;
        text-align: right;
    }

    .bot-message {
        background: #e1bee7;
        color: #3e3e3e;
        margin-right: auto;
        text-align: left;
    }

    .chat-input {
        display: flex;
        padding: 15px;
        border-top: 1px solid #ddd;
        background: #f3e5f5;
    }

    .chat-input input {
        flex: 1;
        border: none;
        border-radius: 10px;
        padding: 12px;
        outline: none;
        background: #fff;
        box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.1);
        margin-right: 10px;
        transition: box-shadow 0.3s ease;
    }

    .chat-input input:focus {
        box-shadow: 0 0 8px rgba(149, 117, 205, 0.5);
    }

    .chat-input button {
        background: #9575cd;
        color: #fff;
        border: none;
        padding: 12px 20px;
        border-radius: 10px;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .chat-input button:hover {
        transform: scale(1.05);
        box-shadow: 0 6px 15px rgba(149, 117, 205, 0.5);
    }

    /* Footer */
    footer {
        background-color: #9575cd;
        color: white;
        padding: 30px 0;
        margin-top: 50px;
        text-align: center;
    }

    footer a {
        color: #e1bee7;
        text-decoration: none;
        transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    footer a:hover {
        color: #fff;
        text-shadow: 0 0 8px #d1c4e9;
    }

    /* Animations */
    @keyframes fadeIn {
        from {
            opacity: 0;
        }

        to {
            opacity: 1;
        }
    }

    @keyframes slideDown {
        from {
            transform: translateY(-50px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    @keyframes fadeInUp {
        from {
            transform: translateY(40px);
            opacity: 0;
        }

        to {
            transform: translateY(0);
            opacity: 1;
        }
    }

    .show {
        opacity: 1 !important;
        transform: translateY(0) !important;
        transition: all 1s ease-in-out;
    }
</style>
</head>

<body>


    <!-- Hero Section -->
    <section class="hero">
        <h1>AI Chat Bot 💡</h1>
        <p>Ask me anything about family, happiness, or stress relief – I’ll try my best to guide you.</p>
    </section>

    <!-- Chatbot -->
    <div class="chat-container animate">
        <div class="chat-box" id="chatBox">
            <div class="chat-message bot-message">Hello 👋! I’m your Buddy. How can I help you today?
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your question..." />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>



    <script>
        // 1. Scroll animation (Kept exactly as it was)
        const chatContainer = document.querySelector(".chat-container");
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add("show");
                }
            });
        });
        observer.observe(chatContainer);

        // 2. Chat Logic (Updated for Gemini API)
        const chatBox = document.getElementById("chatBox");
        const userInput = document.getElementById("userInput");

        function sendMessage() {
            const msg = userInput.value.trim();
            if (msg === "") return;

            // Display User Message
            const userMsg = document.createElement("div");
            userMsg.classList.add("chat-message", "user-message");
            userMsg.textContent = msg;
            chatBox.appendChild(userMsg);
            chatBox.scrollTop = chatBox.scrollHeight;

            userInput.value = ""; // Clear input immediately

            // Send Message to Django Backend
            fetch("{% url 'chat_api' %}", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCookie('csrftoken') // Function to get secure token
                },
                body: JSON.stringify({ message: msg })
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    // Display AI Response
                    const botMsg = document.createElement("div");
                    botMsg.classList.add("chat-message", "bot-message");
                    botMsg.textContent = data.response; // The answer from Gemini
                    chatBox.appendChild(botMsg);
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .catch(error => {
                    console.error("Error:", error);
                    const errorMsg = document.createElement("div");
                    errorMsg.classList.add("chat-message", "bot-message");
                    errorMsg.textContent = "Sorry, I'm having trouble connecting to the server right now.";
                    chatBox.appendChild(errorMsg);
                });
        }

        // Helper function to get Django's CSRF token (Required for security)
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    // Does this cookie string begin with the name we want?
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Enter key submit
        userInput.addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>

{% include 'footer.html' %}
{% endblock %}
