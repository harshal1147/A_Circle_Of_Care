{% load static%}

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- <title>Family Connect</title> -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f3e5f5, #ede7f6);
      color: #3e3e3e;
      overflow-x: hidden;
    }

    /* Navbar */
    .navbar {
      background-color: #9575cd;
    }

    .navbar-brand,
    .nav-link {
      color: #fff !important;
      font-weight: 500;
      transition: color 0.3s ease;
    }

    .nav-link:hover {
      color: #d1c4e9 !important;
    }

    /* Hero Section */
    .hero {
      text-align: center;
      padding: 80px 20px;
      background: linear-gradient(to bottom right, #d1c4e9, #f3e5f5);
      border-radius: 20px;
      margin: 30px auto;
      max-width: 1200px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      animation: fadeIn 2s ease-in-out;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: bold;
      color: #4a148c;
      animation: slideDown 1.5s ease-out;
    }

    .hero p {
      font-size: 1.1rem;
      margin-top: 15px;
      color: #5e35b1;
      animation: fadeInUp 2s ease-in-out;
    }

    /* Feedback Form */
    .feedback-form {
      background: #f8f6fb;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      margin: 40px auto;
      max-width: 700px;
      opacity: 0;
      transform: translateY(30px);
    }

    .feedback-form h3 {
      color: #6a1b9a;
      margin-bottom: 20px;
    }

    .form-control {
      border-radius: 10px;
      border: 1px solid #c7bce0;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #9575cd;
      box-shadow: 0 0 8px rgba(149, 117, 205, 0.5);
    }

    .btn-submit {
      background-color: #9575cd;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .btn-submit:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 15px rgba(149, 117, 205, 0.5);
    }

    /* Footer */
    footer {
      background-color: #9575cd;
      color: white;
      padding: 30px 0;
      margin-top: 50px;
      text-align: center;
    }

    footer a {
      color: #e1bee7;
      text-decoration: none;
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    footer a:hover {
      color: #fff;
      text-shadow: 0 0 8px #d1c4e9;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideDown {
      from {
        transform: translateY(-50px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        transform: translateY(40px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .show {
      opacity: 1 !important;
      transform: translateY(0) !important;
      transition: all 1s ease-in-out;
    }
  </style>
</head>

<body>
 

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">


      <!-- Logo + Brand Name -->
      <a class="navbar-brand d-flex align-items-center" href="{% url 'index' %}">
        <img src="{% static 'images/ACOClogo.jpg' %}" alt="FamilyConnect Logo"
          style="height:50px; width: 50px; margin-right:10px; border-radius:50%;">

      </a>



      <a class="navbar-brand" href="{% url 'index' %}">FamilyConnect</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="{% url 'index' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'feedback' %}">Feedback</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'aisuggestions' %}">AI Chatbot</a></li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'assistant' %}">Voice Assistant</a>
          </li>
          <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
        </ul>
      </div>
      <!-- Profile -->

      <div class="dropdown" style="left: 80px;">
        <button class="btn profile-dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          <img src="{% static 'images/profilelogo.jpg' %}" alt="Sign In" width="40" height="40" class="rounded-circle"
            onerror="this.onerror=null;this.src='https://placehold.co/50x50/8b6125/FFF?text=User';">
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="{% url 'profile' %}">My Profile</a></li>
          <li><a class="dropdown-item" href="{% url 'register' %}">Register</a></li>
          <li>
            <a class="dropdown-item" href="{% url 'login' %}">Login</a>
          </li>

        </ul>
      </div>
    </div>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
{% block content%}
{%endblock%}

</html>
